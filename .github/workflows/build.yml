name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q EdgeLight-android.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk EdgeLight.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeLight-apk
          path: EdgeLight.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Edge Light build ${{ github.run_number }}
          files: EdgeLight.apk
